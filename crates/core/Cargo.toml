[package]
name = "e2ee-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
hex = "0.4.3"
hkdf = "0.13"
prost = "0.14.5"
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
libsignal-protocol = { workspace = true }
e2ee-proto = { workspace = true }
async-trait = "0.1"
rustls = "0.23.46"
webpki-roots = "1.0.12"
url = "2.5.8"
hmac = "0.13"
