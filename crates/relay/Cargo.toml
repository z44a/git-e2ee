[package]
name = "e2ee-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The package keeps its short name (tests use the library as `e2ee_relay`);
# the command is `git-e2ee-relay`.
[[bin]]
name = "git-e2ee-relay"
path = "src/main.rs"

[dependencies]
libsignal-protocol = { workspace = true }
e2ee-proto = { workspace = true }
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
prost = "0.14.5"
rand = "0.9"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rustls = "0.23.46"
tokio-rustls = "0.26.6"
tower = { version = "0.5.3", features = ["util"] }
# HTTP/1 only: no HTTP/2 server code is compiled in.
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
futures-util = "0.3"
