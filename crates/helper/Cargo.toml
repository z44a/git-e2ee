[package]
name = "e2ee-helper"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
e2ee-core = { workspace = true }
e2ee-proto = { workspace = true }
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
rand = "0.9"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
prost = "0.14.5"
qrcode = { version = "0.14.1", default-features = false }
rusqlite = { version = "0.42.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
e2ee-relay = { workspace = true }
reqwest = { version = "0.13.5", default-features = false }
rcgen = "0.14.10"
rustls = "0.23.46"
tokio-rustls = "0.26.6"
