# cargo deny check licenses — the project is AGPL-3.0-only (libsignal), so every
# dependency must be compatible with it.
[graph]
all-features = false

[licenses]
allow = [
  "AGPL-3.0-only",
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "0BSD",
  "MPL-2.0", # file-level copyleft, GPL/AGPL-compatible
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-git = "deny"
allow-git = [
  "https://github.com/signalapp/libsignal",
  "https://github.com/signalapp/SparsePostQuantumRatchet.git",
]
